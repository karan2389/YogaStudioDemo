[build]
  command = "pnpm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.25.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
